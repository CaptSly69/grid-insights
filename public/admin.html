<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin | GRID Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cantata+One&family=Judson:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* GRID brand palette */
  --nile: #1C335E; --muesli: #BE8562; --midnight: #0E192F; --burly: #E2B985; --iron: #D2D2D2;
  --bg: #F9F7F4; --card: #FFFFFF; --ink: #0E192F; --muted: #5A6275; --border: #D2D2D2; --subtle: #F3ECE2;
  --accent: #1C335E; --accent-soft: #F5E8D6; --on-accent: #FFFFFF;
  --warn: #8A4B22; --warn-soft: #F6E3D3; --bad: #B42318; --bad-soft: #FDECEA; --good: #1C335E; --good-soft: #E3E9F4;
  --display: "Cantata One", Georgia, serif; --sans: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Judson", Georgia, serif; --radius: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E192F; --card: #141545; --ink: #FFFFFF; --muted: #D2D2D2; --border: #1C335E; --subtle: #16264A;
    --accent: #E2B985; --accent-soft: rgba(226, 185, 133, 0.16); --on-accent: #0E192F;
    --warn: #E2B985; --warn-soft: rgba(190, 133, 98, 0.22); --bad: #F7877C; --bad-soft: #2E1311; --good: #E2B985; --good-soft: rgba(226, 185, 133, 0.14);
    color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 0.95rem/1.55 var(--sans); }
a { color: var(--accent); text-underline-offset: 0.18em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button, input, textarea, select { font: inherit; color: inherit; }
.shell { max-width: 92rem; margin: 0 auto; padding-inline: clamp(1rem, 3vw, 2.5rem); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--nile); color: #FFFFFF; border-bottom: 3px solid var(--muesli); }
@media (prefers-color-scheme: dark) { .topbar { background: var(--midnight); } }
.topbar .shell { display: flex; align-items: center; gap: 0.75rem 1.25rem; min-height: 3.6rem; flex-wrap: wrap; padding-block: 0.4rem; }
.brand { display: flex; align-items: baseline; gap: 0.5rem; color: #FFFFFF; text-decoration: none; }
.brand-word { font: 400 1.4rem/1 var(--display); letter-spacing: 0.08em; }
.brand-sub { font: italic 400 1rem var(--serif); color: var(--burly); }
.brand-mark { width: 1.35rem; height: 1.35rem; border-radius: 6px; background: var(--accent); color: var(--bg); display: grid; place-items: center; font-size: 0.68rem; font-weight: 700; }
.brand small { color: #D2D2D2; font: 500 0.78rem var(--sans); letter-spacing: 0.04em; }
.tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; }
.tabs a { padding: 0.4rem 0.75rem; border-radius: 8px; color: #D2D2D2; text-decoration: none; font-weight: 500; }
.tabs a:hover { color: #FFFFFF; background: rgba(255,255,255,0.08); }
.tabs a[aria-current="page"] { color: #0E192F; background: var(--burly); }
.topbar :focus-visible { outline-color: var(--burly); }
.tabs .count { display: inline-block; min-width: 1.3rem; margin-left: 0.3rem; padding: 0 0.35rem; border-radius: 999px;
  background: var(--muesli); color: #0E192F; font-size: 0.72rem; font-weight: 700; text-align: center; }
.spacer { flex: 1; }
.top-links { display: flex; gap: 0.5rem; align-items: center; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid var(--border); background: var(--card);
  border-radius: 8px; padding: 0.4rem 0.75rem; font-weight: 500; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--border)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 0.25rem 0.55rem; font-size: 0.85rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.icon-btn { width: 2rem; height: 2rem; justify-content: center; padding: 0; }
input[type=text], input[type=password], input[type=number], textarea {
  width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
textarea { resize: vertical; line-height: 1.5; }
textarea.code { font: 0.86rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 30rem; }
label { display: grid; gap: 0.3rem; font-weight: 500; }
label .hint { font-weight: 400; color: var(--muted); font-size: 0.84rem; }

/* layout bits */
main { padding: 1.75rem 0 4rem; }
h1 { font: 400 1.75rem/1.2 var(--display); color: var(--accent); margin: 0 0 0.25rem; }
h2 { font-size: 1.05rem; letter-spacing: -0.01em; margin: 0 0 0.75rem; }
.lede { color: var(--muted); margin: 0 0 1.5rem; max-width: 46rem; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; }
.stack { display: grid; gap: 1.25rem; }
.row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.12rem 0.55rem; font-size: 0.76rem; font-weight: 600; white-space: nowrap;
  background: var(--subtle); color: var(--muted); }
.badge.published, .badge.verified, .badge.succeeded, .badge.done { background: var(--good-soft); color: var(--good); }
.badge.needs_review, .badge.draft, .badge.in_progress, .badge.running, .badge.queued, .badge.held { background: var(--warn-soft); color: var(--warn); }
.badge.failed, .badge.conflicted, .badge.unverified, .badge.sync_failed, .badge.error { background: var(--bad-soft); color: var(--bad); }
.badge.synced { background: var(--good-soft); color: var(--good); }
.badge.uploaded, .badge.syncing { background: var(--warn-soft); color: var(--warn); }
.empty { color: var(--muted); padding: 1rem 0; }

/* topics */
.add-form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) auto; gap: 0.6rem; align-items: end; }
@media (max-width: 760px) { .add-form { grid-template-columns: 1fr; } }
.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
.queue li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 0.75rem; align-items: center;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.75rem; }
.queue .pos { font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.queue li.next { border-color: var(--accent); }
.queue li.next .pos { color: var(--accent); }
.queue .title { font-weight: 600; }
.queue .notes { color: var(--muted); font-size: 0.85rem; }
.queue .actions { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .queue li { grid-template-columns: 1.8rem minmax(0, 1fr); } .queue .actions { grid-column: 2; justify-content: flex-start; } }
details.group { border-top: 1px solid var(--border); padding-top: 1rem; }
details.group summary { cursor: pointer; font-weight: 600; margin-bottom: 0.75rem; }

/* review */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; padding: 0.2rem; background: var(--card); margin-bottom: 1rem; }
.seg button { border: 0; background: none; padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--subtle); color: var(--ink); }
.list { display: grid; gap: 0.5rem; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem 1rem; align-items: center; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; }
.item:hover { border-color: var(--accent); }
.item .t { font-weight: 600; }
.item .m { color: var(--muted); font-size: 0.84rem; display: flex; gap: 0.4rem 0.9rem; flex-wrap: wrap; }

.detail-head { display: grid; gap: 0.6rem; margin-bottom: 1rem; }
.detail-head h1 { font: 400 clamp(1.45rem, 2.6vw, 1.95rem)/1.25 var(--display); }
.actions-bar { display: flex; gap: 0.45rem; flex-wrap: wrap; }
.checks { border-radius: 10px; padding: 0.75rem 0.95rem; margin-bottom: 1rem; }
.checks.ok { background: var(--accent-soft); color: var(--accent); }
.checks.bad { background: var(--bad-soft); color: var(--bad); }
.checks ul { margin: 0.35rem 0 0; padding-left: 1.2rem; }
.split { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .split > .claims-col { position: sticky; top: 4.4rem; max-height: calc(100vh - 5.4rem); overflow: auto; } }
.preview { font: 0.98rem/1.8 var(--sans); }
.preview h2 { font: 400 1.25rem var(--display); color: var(--accent); margin: 1.8rem 0 0.5rem; }
.preview h2:first-child { margin-top: 0; }
.preview p, .preview li { max-width: 70ch; }
.preview .summary { color: var(--muted); font: italic 1.12rem/1.5 var(--serif); border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin: 0 0 1rem; }
.mk { font: 600 0.68rem/1 var(--sans); border: 0; border-radius: 0.5em; padding: 0.25em 0.45em; margin: 0 0.08em; vertical-align: 0.3em;
  cursor: pointer; background: var(--accent-soft); color: var(--accent); }
.mk.bad { background: var(--bad-soft); color: var(--bad); }
.claim { border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 0.85rem; background: var(--card); display: grid; gap: 0.4rem; scroll-margin-top: 5rem; }
.claim.flash { outline: 2px solid var(--accent); }
.claim.uncited { opacity: 0.72; }
.claim .head { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.claim .head strong { color: var(--ink); }
.claim blockquote { margin: 0; padding: 0.15rem 0 0.15rem 0.7rem; border-left: 3px solid var(--muesli); font: 1rem/1.45 var(--serif); }
.claim .src { font-size: 0.84rem; }
.claim .links { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.claims-list { display: grid; gap: 0.6rem; }

/* runs */
.run { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.run summary { list-style: none; cursor: pointer; display: grid; gap: 0.35rem 1rem; padding: 0.75rem 0.95rem;
  grid-template-columns: 3.2rem minmax(0, 1fr) auto; align-items: center; }
.run summary::-webkit-details-marker { display: none; }
.run .rid { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.run .meta { color: var(--muted); font-size: 0.84rem; display: flex; gap: 0.3rem 0.9rem; flex-wrap: wrap; }
.run .body { border-top: 1px solid var(--border); padding: 0.75rem 0.95rem; display: grid; gap: 0.6rem; font-size: 0.88rem; }
.run .err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 0.55rem 0.7rem; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.log li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 0.6rem; }
.log .st { color: var(--muted); font-weight: 600; }

/* settings */
.form-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }

/* flow of five steps */
.flowwrap { padding-top: 1.6rem; }
.page-title { display: grid; gap: 0.2rem; margin-bottom: 1.1rem; }
.page-title h1 { font-size: 1.9rem; }
.page-title p { margin: 0; color: var(--muted); }
.flow { display: flex; flex-wrap: wrap; gap: 8px; }
.flow a { flex: 1 1 200px; min-height: 104px; display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 0;
  padding: 12px 40px 12px 44px; text-decoration: none; background: #ECE6DD; color: #1C335E;
  clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 0 100%, 26px 50%); }
.flow a:first-child { padding-left: 22px; clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 0 100%); }
.flow a.attention { background: #F5E1D2; color: #0E192F; }
.flow a[aria-current="page"] { background: #1C335E; color: #FFFFFF; }
.flow a:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #BE8562; }
.flow .k { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #4A5266; }
.flow a.attention .k, .flow a.attention .st { color: #6E3A1A; }
.flow a[aria-current="page"] .k, .flow a[aria-current="page"] .st { color: #E2B985; }
.flow .cnt { margin-left: auto; min-width: 26px; padding: 2px 9px; border-radius: 999px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0; background: #FFFFFF; color: #1C335E; }
.flow a.attention .cnt { background: #BE8562; color: #0E192F; }
.flow a[aria-current="page"] .cnt { background: #E2B985; color: #0E192F; }
.flow .t { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
.flow .st { font-size: 13px; color: #4A5266; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: clamp(1.1rem, 2.5vw, 1.75rem); display: grid; gap: 1.25rem; margin-top: 1.25rem; }
.step-head { display: grid; gap: 0.3rem; }
.step-head .k { font-size: 13px; font-weight: 600; color: var(--warn); }
.step-head h1 { margin: 0; font-size: 1.65rem; }
.step-head p { margin: 0; color: var(--muted); max-width: 48rem; }
.step-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; border-top: 1px solid var(--border); padding-top: 1rem; }
.step-foot span { color: var(--muted); font-size: 0.9rem; }
.cards { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr)); }
.acard { border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.6rem; background: var(--card); }
.acard h3 { margin: 0; font: 400 1.08rem/1.35 var(--display); color: var(--accent); }
.acard .m { color: var(--muted); font-size: 0.84rem; }
.acard .acts { margin-top: auto; display: flex; flex-wrap: wrap; gap: 0.45rem; }
.held { border: 2px solid var(--muesli); border-radius: 14px; padding: 1.1rem 1.2rem; display: grid; gap: 0.75rem; }
.held h3 { margin: 0; font: 400 1.3rem/1.3 var(--display); color: var(--accent); }
.held ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.25rem; }
.allclear { border-radius: 14px; padding: 1.1rem 1.2rem; background: var(--good-soft); color: var(--good); }
.duo { display: flex; flex-wrap: wrap; gap: 0.9rem; }
.duo > div { flex: 1 1 20rem; border-radius: 14px; padding: 1rem 1.2rem; display: grid; gap: 0.25rem; }
.duo .dark { background: #1C335E; color: #FFFFFF; }
.duo .dark .k { color: #E2B985; font-size: 13px; font-weight: 600; }
.duo .dark .big { font: 400 1.5rem var(--display); }
.duo .dark .s { color: #D2D2D2; font-size: 0.9rem; }
.duo .light { background: var(--subtle); }
.duo .light .k { color: var(--warn); font-size: 13px; font-weight: 600; }
.gear { display: inline-flex; align-items: center; gap: 0.4rem; }

/* login */
.login { min-height: 70vh; display: grid; place-items: center; }
.login .panel { width: min(24rem, 100%); display: grid; gap: 0.9rem; }

/* dialog + toast */
dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--ink); padding: 1.2rem 1.3rem; width: min(32rem, calc(100vw - 2rem)); }
dialog::backdrop { background: rgba(9, 9, 11, 0.45); }
dialog ul { padding-left: 1.2rem; }
.toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); z-index: 50; background: var(--midnight); color: #FFFFFF; border-left: 4px solid var(--muesli);
  border-radius: 10px; padding: 0.6rem 1rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: calc(100vw - 2rem); }
.toast.error { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <div class="shell">
    <a class="brand" href="#/queue" aria-label="GRID Insights admin"><span class="brand-word">GRID</span><span class="brand-sub">Insights</span> <small>ADMIN</small></a>
    <span class="spacer"></span>
    <div class="top-links">
      <a class="btn small" href="/" target="_blank" rel="noopener">View website</a>
      <a class="btn small gear" href="#/settings" id="gear"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings</a>
      <button class="btn small" id="logout" type="button">Sign out</button>
    </div>
  </div>
</header>
<div class="shell flowwrap" id="flowwrap" hidden>
  <div class="page-title"><h1>Article pipeline</h1><p>Every day, a topic moves from left to right until it is live on the website and in Cody. Click a step to open it.</p></div>
  <nav class="flow" id="flow" aria-label="Pipeline steps"></nav>
</div>
<main class="shell" id="app" aria-live="polite"></main>
<dialog id="dialog"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="marked.umd.js"></script>
<script>
const app = document.getElementById("app");
const topbar = document.getElementById("topbar");
const dialogEl = document.getElementById("dialog");

/* ---------- helpers ---------- */
const el = (tag, attrs = {}, ...children) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) n.append(c);
  return n;
};
const fmt = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const fmtDay = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
const label = (s) => ({ needs_review: "Needs review", in_progress: "In progress" }[s] || (s ? s[0].toUpperCase() + s.slice(1) : ""));
const badge = (s, text) => el("span", { class: `badge ${s || ""}`, text: text || label(s) });
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const CODY_LABEL = { uploaded: "Sent to Cody", syncing: "Cody learning", synced: "In Cody", sync_failed: "Cody failed", error: "Cody error", removed: "Removed from Cody" };
const codyBadge = (st) => st ? badge(st, CODY_LABEL[st] || st) : el("span", { class: "badge", text: "Not in Cody yet" });

let toastTimer;
function toast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast" + (isError ? " error" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 6000 : 3000);
}

async function api(path, { method = "GET", body } = {}) {
  const headers = { accept: "application/json" };
  if (method !== "GET") { headers["content-type"] = "application/json"; headers["x-admin-request"] = "1"; }
  const res = await fetch("/api/admin/" + path, { method, headers, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  let data = {};

/* ---------- the five-step flow ---------- */
const ICONS = {
  queue: '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
  research: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  review: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  published: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/>',
  cody: '<path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6.5A2.5 2.5 0 0 0 4 20.5"/><path d="M20 18v3H6.5"/><path d="M9 8h7"/><path d="M9 12h5"/>',
};
const STEPS = [
  { key: "queue", title: "Queue" }, { key: "research", title: "Research" }, { key: "review", title: "Review" },
  { key: "published", title: "Published" }, { key: "cody", title: "Cody" },
];
const RUN_LABEL = { succeeded: "Written", failed: "Stopped", running: "Running now" };
let currentStep = "queue";
let flowInfo = {};

function shortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const day = d.toDateString() === now.toDateString() ? "Today" : d.toDateString() === new Date(now - 86400000).toDateString() ? "Yesterday" : fmtDay(iso);
  return `${day}, ${d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true })}`;
}
function nextWriterRun() {
  const manilaHour = Number(new Date().toLocaleString("en-US", { timeZone: "Asia/Manila", hour: "numeric", hour12: false }));
  return manilaHour < 14 ? "Today, 2:00 PM" : "Tomorrow, 2:00 PM";
}

function drawFlow() {
  const nav = document.getElementById("flow");
  nav.replaceChildren(...STEPS.map((st, i) => {
    const info = flowInfo[st.key] || {};
    const a = el("a", { href: `#/${st.key}`, class: info.attention ? "attention" : "" },
      el("span", { class: "k" }, `STEP ${i + 1}`, info.count != null ? el("span", { class: "cnt", text: String(info.count) }) : null),
      el("span", { class: "t" }, (() => { const sp = el("span", { "aria-hidden": "true", style: "display:inline-flex" }); sp.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[st.key]}</svg>`; return sp; })(), st.title),
      el("span", { class: "st", text: info.status || "" }));
    if (st.key === currentStep) a.setAttribute("aria-current", "page");
    return a;
  }));
}

async function refreshFlow() {
  drawFlow();
  try {
    const [o, t, c] = await Promise.all([api("overview"), api("topics"), api("cody").catch(() => null)]);
    const queued = t.topics.filter((x) => x.status === "queued");
    const running = t.topics.filter((x) => x.status === "in_progress");
    const lr = o.last_run;
    const codyCounts = {};
    (c?.articles || []).forEach((a) => { codyCounts[a.status || "none"] = (codyCounts[a.status || "none"] || 0) + 1; });
    const codyErrors = (codyCounts.error || 0) + (codyCounts.sync_failed || 0);
    flowInfo = {
      queue: { count: queued.length, attention: queued.length < 3,
        status: queued.length ? (queued.length < 3 ? `Only ${queued.length} left: add topics` : `Next: ${queued[0].title}`) : "Empty: add topics" },
      research: { count: running.length || null, attention: lr?.status === "failed",
        status: running.length ? `Writing: ${running[0].title}` : lr ? `Last run ${shortDate(lr.started_at)}: ${RUN_LABEL[lr.status] || lr.status}` : "Runs daily at 2:00 PM" },
      review: { count: o.to_review, attention: o.to_review > 0,
        status: o.to_review ? `${plural(o.to_review, "article")} need${o.to_review === 1 ? "s" : ""} you` : "All clear" },
      published: { count: o.published, status: "Live on the website" },
      cody: !c ? { status: "Status unavailable" } : !c.configured ? { attention: true, status: "Not connected yet" } :
        { count: codyCounts.synced || 0, attention: codyErrors > 0, status: codyErrors ? `${plural(codyErrors, "article")} need a retry` : "Next sync 5:00 PM" },
    };
    drawFlow();
  } catch { /* the flow is a summary; the step itself still works */ }
}
const refreshCounts = () => refreshFlow();

function stepHead(n, title, text) {

      el("div", { class: "actions" },

        el("button", { class: "btn icon-btn", type: "button", "aria-label": `Move "${t.title}" down`, title: "Move down", disabled: last,

        el("button", { class: "btn small", type: "button", text: "Skip",

      badge(t.status, ""),

        el("div", { class: "notes" }, `Updated ${fmt(t.updated_at)}`, t.runs ? `, ${plural(t.runs, "run")}` : "")),
      el("div", { class: "actions" }, buttons(t)))));
  };

    el("details", { class: "group" }, el("summary", { text: `Already written (${groups.done.length})` }), doneList),

  const data = await api("cody");

  data.articles.forEach((a) => { const k = a.status || "none"; counts[k] = (counts[k] || 0) + 1; });
  const progress = el("p", { class: "muted small", style: "margin:0", "aria-live": "polite" });

  const syncBtn = el("button", { class: "btn primary", type: "button", text: "Sync now", disabled: !data.configured });
  syncBtn.addEventListener("click", async () => {
    syncBtn.disabled = true;
    const total = { uploaded: 0, replaced: 0, removed: 0, learned: 0, errors: [] };
    try {
      for (let step = 1; step <= 15; step++) {
        progress.textContent = `Syncing (step ${step})`;
        const r = await api("cody/sync", { method: "POST" });
        if (!r.ok) { toast(r.message || "Sync failed.", true); break; }
        const s = r.summary;
        total.uploaded += s.uploaded.length; total.replaced += s.replaced.length; total.removed += s.removed.length;
        total.learned += s.learned; total.errors.push(...s.errors);
        if (!s.remaining || s.errors.length) break;
      }
      const parts = [`${total.uploaded} sent`, `${total.replaced} replaced`, `${total.removed} removed`, `${total.learned} learned`];
      toast(total.errors.length ? `Sync finished with ${plural(total.errors.length, "problem")}: ${total.errors[0].message}` : `Sync finished: ${parts.join(", ")}.`, total.errors.length > 0);
    } catch (e) { if (!e.quiet) toast(e.message, true); }
    renderCody();
  });

  const foldersBox = el("section", { class: "panel" });

      el("li", { text: "In Netlify: add CODY_API_KEY and CODY_FOLDER_ID under Environment variables." }),
      el("li", { text: "Redeploy under Deploys > Trigger deploy, then come back here." })));

  const list = data.articles.length ? el("div", { class: "list" }, data.articles.map((a) => el("a", { class: "item", href: `#/review/${a.id}` },

/* ---------- Review (step 3) ---------- */
async function renderReview() {
  document.title = "Review | GRID Insights admin";
  const { articles } = await api("articles");
  const waiting = articles.filter((a) => a.status === "draft" || a.status === "needs_review");
  const details = await Promise.all(waiting.map((a) => api(`articles/${a.id}`).catch(() => null)));

  const publishAnyway = async (a, problems) => {
    const go = await confirmDialog("Publish this article anyway?", problems.length ? "These problems are still open:" : "", "Publish anyway", problems.length ? problems : null, true);
    if (!go) return;
    await act(() => api(`articles/${a.id}/status`, { method: "POST", body: { status: "published", force: true } }), "Published. It will appear on the website within a minute.");
    refreshFlow(); renderReview();
  };
  const writeAgain = async (a) => {
    if (!(await confirmDialog("Write this article again?", "This version will be archived and its topic moved to the front of the queue, so the next run writes a fresh version.", "Write it again"))) return;
    await act(() => api(`articles/${a.id}/rerun`, { method: "POST" }), "Done. The topic is first in the queue.");
    refreshFlow(); renderReview();
  };

  const cards = waiting.map((a, i) => {
    const d = details[i];
    const auto = d?.article?.critic_report?.auto_review;
    const problems = [...new Set([...(auto?.problems || []), ...(d?.checks?.problems || [])])];
    return el("article", { class: "held" },
      el("div", { class: "row" }, badge(a.status, a.status === "needs_review" ? "Held for review" : "Draft, not checked yet"),
        el("span", { class: "muted small", text: `Written ${shortDate(a.created_at)}` })),
      el("h3", { text: a.title }),
      problems.length ? el("div", {}, el("strong", { class: "small", text: "What needs attention" }), el("ul", {}, problems.map((x) => el("li", { text: x }))))
        : el("p", { class: "muted small", style: "margin:0", text: a.status === "draft" ? "The 4:00 PM check hasn't reviewed this yet. You can wait for it, or open it now." : "No open problems listed. Open it to read it before publishing." }),
      el("div", { class: "row" },
        el("a", { class: "btn primary", href: `#/review/${a.id}`, text: "Open and fix" }),
        el("button", { class: "btn", type: "button", text: "Write it again", onclick: () => writeAgain(a) }),
        el("button", { class: "btn", type: "button", style: "color:var(--muted)", text: "Publish anyway", onclick: () => publishAnyway(a, problems) })));
  });

  const others = articles.filter((a) => a.status === "archived");
  app.replaceChildren(el("div", { class: "step-panel" },
    stepHead(3, "Needs your decision", "At 4:00 PM, a second check reviews every draft. Articles that pass go live on their own and skip this step. Anything it couldn't fix waits here for you."),
    cards.length ? el("div", { class: "stack" }, cards)
      : el("div", { class: "allclear" }, el("strong", { text: "All clear. " }), "Nothing needs your decision right now."),
    others.length ? el("details", { class: "group" }, el("summary", { text: `Archived articles (${others.length})` }),
      el("div", { class: "list" }, others.map((a) => el("a", { class: "item", href: `#/review/${a.id}` },
        el("div", {}, el("div", { class: "t", text: a.title }), el("div", { class: "m" }, el("span", { text: `Written ${fmtDay(a.created_at)}` }))), badge(a.status))))) : null,
    stepFoot("Approved articles appear under Published.", "Next step: Published", "#/published")));
}

/* ---------- Published (step 4) ---------- */
async function renderPublished() {
  document.title = "Published | GRID Insights admin";
  const { articles } = await api("articles");
  const live = articles.filter((a) => a.status === "published").sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
  const unpublish = async (a) => {
    if (!(await confirmDialog("Take this article off the website?", "It goes back to Review as a draft, and it is removed from Cody at the next sync. You can publish it again later.", "Unpublish", null, true))) return;
    await act(() => api(`articles/${a.id}/status`, { method: "POST", body: { status: "draft" } }), "Unpublished.");
    refreshFlow(); renderPublished();
  };
  const grid = el("div", { class: "cards" }, live.map((a) => {
    const card = el("article", { class: "acard" },
      el("span", { class: "m", text: `Published ${fmtDay(a.published_at)}, ${plural(a.claims, "cited fact")}` }),
      el("h3", { text: a.title }),
      el("div", { class: "row", style: "gap:0.4rem" }, a.cody_status ? codyBadge(a.cody_status) : codyBadge(null)),
      el("div", { class: "acts" },

        el("a", { class: "btn small", href: `#/review/${a.id}`, text: "Open" }),

    live.length ? el("label", { for: "pub-q", style: "max-width:22rem" }, "Find an article", search) : null,
    live.length ? grid : el("p", { class: "empty", text: "Nothing is published yet." }), none,
    stepFoot("At 5:00 PM, new articles are sent to Cody.", "Next step: Cody", "#/cody")));
}

/* ---------- router ---------- */
async function route() {
  const h = location.hash || "#/queue";
  try { await api("session"); }
  catch (e) {
    if (e.quiet) return; // 401: the login form is already showing
    topbar.hidden = true;
    app.replaceChildren(el("div", { class: "login" }, el("div", { class: "panel" },
      el("h1", { text: "The admin can't start" }),
      el("p", { text: e.message }),
      el("p", { class: "muted small", text: "Check the environment variables in Netlify (ADMIN_PASSWORD and DATABASE_URL), then redeploy under Deploys > Trigger deploy." }),
      el("button", { class: "btn primary", type: "button", text: "Try again", onclick: () => route() }))));
    return;
  }
  topbar.hidden = false;
  document.getElementById("flowwrap").hidden = false;
  let [, tab, sub] = h.match(/^#\/(\w+)(?:\/(\d+))?/) || [];
  tab = { topics: "queue", runs: "research" }[tab] || tab;
  const known = ["queue", "research", "review", "published", "cody", "settings"];
  const current = known.includes(tab) ? tab : "queue";
  currentStep = current === "settings" ? "" : current;
  if (current === "review" && sub) currentStep = ""; // set after the article loads
  document.getElementById("gear").toggleAttribute("aria-current", current === "settings");
  app.replaceChildren(el("p", { class: "muted", style: "margin-top:1.25rem", text: "Loading" }));
  refreshFlow();
  try {
    if (current === "review" && sub) await renderReviewDetail(Number(sub));
    else if (current === "review") await renderReview();
    else if (current === "research") await renderResearch();
    else if (current === "published") await renderPublished();
    else if (current === "cody") await renderCody();
    else if (current === "settings") await renderSettings();
    else await renderTopics();
  } catch (e) {
    if (!e.quiet) app.replaceChildren(el("div", { class: "step-panel" }, el("h2", { text: "Something went wrong" }), el("p", { class: "muted", text: e.message })));
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
