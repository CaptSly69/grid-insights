<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRID Insights | Philippine real estate, explained</title>
<meta name="description" content="Plain-language guides to the Philippine real estate market from GRID Property Ventures, with a source behind every fact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cantata+One&family=Judson:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* GRID brand palette */
  --nile: #1C335E; --muesli: #BE8562; --midnight: #0E192F; --deep-code: #141545;
  --burly: #E2B985; --iron: #D2D2D2;
  --bg: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0E192F;
  --muted: #5A6275;
  --border: #D2D2D2;
  --subtle: #F7F2EB;
  --accent: #1C335E;
  --accent-2: #BE8562;
  --accent-soft: #F5E8D6;
  --on-accent: #FFFFFF;
  --glow: rgba(190, 133, 98, 0.14);
  --bar-bg: #1C335E; --bar-ink: #FFFFFF; --bar-muted: #D2D2D2;
  --display: "Cantata One", Georgia, "Times New Roman", serif;
  --sans: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Judson", Georgia, "Times New Roman", serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E192F; --card: #141545; --ink: #FFFFFF; --muted: #D2D2D2; --border: #1C335E;
    --subtle: #16264A; --accent: #E2B985; --accent-2: #BE8562; --accent-soft: rgba(226, 185, 133, 0.16);
    --on-accent: #0E192F; --glow: rgba(226, 185, 133, 0.12);
    --bar-bg: #0E192F; --bar-ink: #FFFFFF; --bar-muted: #D2D2D2;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 5rem; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--sans);
  padding-bottom: env(safe-area-inset-bottom, 0); }
a { color: var(--accent); text-underline-offset: 0.18em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
button { font: inherit; }

.shell { width: 100%; max-width: 92rem; margin: 0 auto; padding-inline: clamp(1rem, 4vw, 3rem); }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0);
  background: var(--bar-bg); color: var(--bar-ink); border-bottom: 1px solid color-mix(in srgb, var(--burly) 35%, transparent); }
.topbar .shell { display: flex; align-items: center; gap: 1rem; min-height: 4rem; }
.brand { color: var(--bar-ink); text-decoration: none; display: flex; align-items: baseline; gap: 0.6rem; }
.brand-word { font: 400 1.55rem/1 var(--display); letter-spacing: 0.08em; }
.brand-sub { font: italic 400 1.05rem var(--serif); color: var(--burly); }
.topbar .spacer { flex: 1; }
.topbar .count { color: var(--bar-muted); font-size: 0.88rem; }
.search { position: relative; width: min(20rem, 45vw); }
.search input { width: 100%; font: 0.9rem var(--sans); color: #0E192F; background: #FFFFFF;
  border: 1px solid transparent; border-radius: 10px; padding: 0.5rem 0.8rem; }
.search input::placeholder { color: #5A6275; }
.search input:focus { outline: 2px solid var(--burly); outline-offset: 1px; }
.nav-link { font-size: 0.88rem; font-weight: 500; color: var(--bar-ink); text-decoration: none;
  border: 1px solid color-mix(in srgb, var(--bar-ink) 40%, transparent); border-radius: 10px; padding: 0.42rem 0.85rem; }
.nav-link:hover { border-color: var(--burly); color: var(--burly); }
.topbar :focus-visible { outline-color: var(--burly); }
.progress { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: var(--muesli); }

/* Home intro */
.intro { padding: clamp(2rem, 5vw, 3.5rem) 0 1.75rem; display: grid; gap: 0.6rem; }
.intro h1 { margin: 0; font: 400 clamp(2rem, 4.6vw, 3.3rem)/1.12 var(--display); color: var(--accent); max-width: 20ch; }
.intro .rule { width: 4rem; height: 3px; background: var(--muesli); border-radius: 2px; margin: 0.35rem 0 0.25rem; }
.intro p { margin: 0; color: var(--muted); font-size: 1.08rem; max-width: 46rem; }

/* Cards */
.grid { list-style: none; margin: 0; padding: 0 0 3rem; display: grid; gap: 1.25rem;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 19.5rem), 1fr)); }
.card { position: relative; display: flex; flex-direction: column; overflow: hidden;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.card::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(22rem circle at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 60%); }
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.card:hover::before { opacity: 1; }
.card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.cover { aspect-ratio: 16 / 7; background: var(--subtle); border-bottom: 1px solid var(--border); display: block; }
.cover svg { width: 100%; height: 100%; display: block; }
.card-body { display: flex; flex-direction: column; gap: 0.6rem; padding: 1.15rem 1.25rem 1.2rem; flex: 1; }
.card-meta { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; color: var(--muted); font-size: 0.82rem; }
.card h2 { margin: 0; font: 400 1.16rem/1.38 var(--display); letter-spacing: 0;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card h2 a { color: var(--ink); text-decoration: none; }
.card h2 a:focus-visible { outline: none; }
.card h2 a::after { content: ""; position: absolute; inset: 0; z-index: 1; }
.card p { margin: 0; color: var(--muted); font-size: 0.94rem;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { margin-top: auto; padding-top: 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.badge.latest { background: var(--muesli); color: #0E192F; }
.badge { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; font-weight: 600;
  color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0.2rem 0.6rem; white-space: nowrap; }
.read { font-size: 0.86rem; font-weight: 600; color: var(--ink); }
.card:hover .read { color: var(--accent); }

.card.featured { grid-column: 1 / -1; flex-direction: row; min-height: 18rem; }
.card.featured .cover { aspect-ratio: auto; width: 44%; border-bottom: 0; border-right: 1px solid var(--border); background: var(--nile); }
.card.featured .card-body { padding: clamp(1.4rem, 3vw, 2.4rem); gap: 0.85rem; justify-content: center; }
.card.featured h2 { font-size: clamp(1.45rem, 2.4vw, 2rem); line-height: 1.2; letter-spacing: -0.025em; }
.card.featured p { font-size: 1.02rem; -webkit-line-clamp: 4; max-width: 44rem; }
.card.featured .card-foot { margin-top: 0.4rem; justify-content: flex-start; }
@media (max-width: 760px) {
  .card.featured { flex-direction: column; min-height: 0; }
  .card.featured .cover { width: auto; aspect-ratio: 16 / 7; border-right: 0; border-bottom: 1px solid var(--border); }
}
.no-match { color: var(--muted); padding: 0 0 3rem; }

/* Article page: three columns on wide screens */
.layout { display: grid; gap: clamp(1.5rem, 3vw, 3.5rem); padding: 2rem 0 1rem;
  grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1180px) {
  .layout { grid-template-columns: 14rem minmax(0, 44rem) minmax(15rem, 20rem); justify-content: space-between; }
}
.toc, .rail { display: none; }
@media (min-width: 1180px) {
  .toc, .rail { display: block; }
  .toc > div, .rail > div { position: sticky; top: 5.25rem; }
  .sources-end { display: none; }
}
.side-title { font: 600 0.82rem var(--sans); color: var(--muted); margin: 0 0 0.75rem; }
.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
.toc a { display: block; padding: 0.32rem 0 0.32rem 0.9rem; margin-left: -1px; border-left: 2px solid transparent;
  color: var(--muted); text-decoration: none; font-size: 0.88rem; line-height: 1.4; }
.toc a:hover { color: var(--ink); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }

.rail-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; }
.src-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.15rem; }
.src-list li { display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.5rem; padding: 0.45rem 0.4rem; border-radius: 8px; font-size: 0.86rem; line-height: 1.4; }
.src-list li.flash { background: var(--accent-soft); }
.src-list .n { font-weight: 700; color: var(--accent); font-size: 0.8rem; padding-top: 0.08rem; }
.src-list a { color: var(--ink); text-decoration: none; font-weight: 500; }
.src-list a:hover { color: var(--accent); text-decoration: underline; }
.src-list .pub { display: block; color: var(--muted); font-size: 0.8rem; }

article .back { font-size: 0.88rem; font-weight: 500; text-decoration: none; }
article h1 { font: 400 clamp(1.9rem, 4vw, 2.7rem)/1.18 var(--display); color: var(--accent); margin: 1rem 0 0.9rem; }
.dek { font: italic 400 1.28rem/1.5 var(--serif); color: var(--muted); margin: 0 0 1.25rem; }
.byline { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.chip { font-size: 0.82rem; color: var(--muted); border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 0.22rem 0.7rem; }
.chip.accent { color: var(--accent); border-color: transparent; background: var(--accent-soft); font-weight: 600; text-decoration: none; }
.body { font: 400 1.02rem/1.85 var(--sans); }
.body h2 { font: 400 1.5rem/1.3 var(--display); color: var(--accent); margin: 2.6rem 0 0.7rem; padding-top: 0.2rem; }
.body h2::before { content: ""; display: block; width: 2.5rem; height: 2px; background: var(--muesli); margin-bottom: 0.7rem; }
.body h3 { font: 700 1.15rem var(--serif); margin: 2rem 0 0.5rem; }
.body p, .body li { max-width: 70ch; }
.body ul, .body ol { padding-left: 1.3rem; }
.body li { margin: 0.4rem 0; }
.body blockquote { margin: 1.5rem 0; padding: 0.2rem 0 0.2rem 1.1rem; border-left: 3px solid var(--border); color: var(--muted); }
.table-scroll { overflow-x: auto; }
.body table { border-collapse: collapse; font: 0.92rem/1.5 var(--sans); margin: 1.5rem 0; }
.body th, .body td { border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }

.cite { white-space: nowrap; margin-left: 0.12em; }
.cite button { font: 600 0.66rem/1 var(--sans); color: var(--accent); background: var(--accent-soft); border: 0;
  border-radius: 0.55em; padding: 0.3em 0.48em; margin: 0 0.06em; vertical-align: 0.38em; cursor: pointer; min-width: 1.55em; }
.cite button:hover, .cite button[aria-expanded="true"] { background: var(--accent); color: var(--bg); }
.popover { position: absolute; z-index: 30; width: min(22rem, calc(100vw - 2rem)); background: var(--card); color: var(--ink);
  border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem 1rem; box-shadow: 0 12px 32px rgba(9, 9, 11, 0.16);
  font: 0.9rem/1.45 var(--sans); }
.popover .pub { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.2rem; }
.popover a { font-weight: 600; word-break: break-word; }
.popover .jump { display: inline-block; margin-top: 0.4rem; font-weight: 400; font-size: 0.82rem; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }

.sources-end { margin-top: 3rem; }
.disclaimer { margin-top: 2rem; padding: 1rem 1.15rem; border-radius: 12px; background: var(--card);
  border: 1px solid var(--border); color: var(--muted); font-size: 0.88rem; }
.more { padding: 2.5rem 0 1rem; border-top: 1px solid var(--border); margin-top: 2.5rem; }
.more h2 { font: 400 1.35rem var(--display); color: var(--accent); margin: 0 0 1.25rem; }
.more .grid { padding-bottom: 1rem; }

.state { padding: 4rem 0; color: var(--muted); max-width: 40rem; }
.state h2 { color: var(--accent); font: 400 1.45rem var(--display); margin: 0 0 0.5rem; }
footer { background: var(--midnight); color: var(--iron); font-size: 0.85rem; padding: 2rem 0 2.75rem; margin-top: 2rem;
  border-top: 3px solid var(--muesli); }
footer .foot { display: flex; flex-wrap: wrap; gap: 0.75rem 2rem; align-items: baseline; justify-content: space-between; }
footer .foot-brand { font: 400 1.25rem var(--display); color: #FFFFFF; letter-spacing: 0.08em; }
footer .foot-brand span { font: italic 400 1rem var(--serif); color: var(--burly); letter-spacing: 0; margin-left: 0.4rem; }

.chip.dl { cursor: pointer; color: var(--accent); border-color: var(--accent); font-weight: 600; font-family: var(--sans); }
.chip.dl:hover { background: var(--accent); color: var(--on-accent); }
.chip.dl[disabled] { opacity: 0.6; cursor: progress; }
@media print {
  .topbar, .toc, .rail, .more, footer, .back, .chip.dl, .progress, .popover { display: none !important; }
  .layout { display: block !important; padding: 0 !important; }
  .sources-end { display: block !important; }
  body { background: #FFFFFF !important; color: #0E192F !important; }
  .body { font-size: 11pt; }
  .cite button { background: none !important; color: #BE8562 !important; padding: 0; }
  a { color: inherit; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .card::before { transition: border-color 0.2s ease, opacity 0.25s ease; }
  .reveal { animation: rise 0.4s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="shell">
    <a class="brand" href="#/" aria-label="GRID Insights home"><span class="brand-word">GRID</span><span class="brand-sub" id="brand-name">Insights</span></a>
    <span class="spacer"></span>
    <div id="topbar-tools"></div>
  </div>
  <div class="progress" id="progress" hidden></div>
</header>
<main class="shell" id="app" aria-live="polite"></main>
<footer><div class="shell foot"><span class="foot-brand">GRID<span>Property Ventures</span></span><span>General information only. Not legal, tax or investment advice. &copy; <span id="year">2026</span> GRID Property Ventures, Inc.</span></div></footer>

<script src="marked.umd.js"></script>
<script>
const SITE_NAME = "GRID Insights";
const WORDS_PER_MINUTE = 220;
const app = document.getElementById("app");
const tools = document.getElementById("topbar-tools");
const progress = document.getElementById("progress");
document.getElementById("year").textContent = new Date().getFullYear();

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
};
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const minutesFromText = (md) => Math.max(1, Math.round((md || "").replace(/\[c\d+\]/g, "").split(/\s+/).filter(Boolean).length / WORDS_PER_MINUTE));

async function api(params = "") {
  const res = await fetch("/api/articles" + params, { headers: { accept: "application/json" } });
  let data = {};
  try { data = await res.json(); } catch { /* non-JSON */ }
  if (!res.ok) throw Object.assign(new Error(data.message || `Request failed (${res.status}).`), { code: data.error, status: res.status });
  return data;
}

function showState(title, message, linkHome = false) {
  app.replaceChildren(el("div", { class: "state" },
    el("h2", { text: title }), message ? el("p", { text: message }) : null,
    linkHome ? el("p", {}, el("a", { href: "#/", text: "Go to all guides" })) : null));
}

/* Generated cover: an abstract dot pattern, unique per article. Decorative only, not data. */
function cover(slug, featured = false) {
  let h = 2166136261;
  for (const ch of slug) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rand = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
  const cols = featured ? 22 : 16, rows = featured ? 14 : 7, gap = 20, r = 3.2;
  const w = 20 + (cols - 1) * gap + 20, hgt = 16 + (rows - 1) * gap + 16;
  let dots = "";
  const band = rand() * rows;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const near = Math.abs(y - band - Math.sin(x / 2.4 + rand() * 0.3) * (featured ? 3.2 : 1.6)) < (featured ? 1.6 : 1.1);
    const on = near || rand() < 0.06;
    dots += `<circle cx="${20 + x * gap}" cy="${16 + y * gap}" r="${on ? r + 0.6 : r * 0.62}" fill="${featured ? (on ? (x % 3 === 0 ? "var(--muesli)" : "var(--burly)") : "rgba(255,255,255,0.16)") : (on ? (x % 4 === 0 ? "var(--muesli)" : "var(--accent)") : "var(--border)")}" opacity="${on ? 0.9 : 1}"/>`;
  }
  const wrap = el("div", { class: "cover", "aria-hidden": "true" });
  wrap.innerHTML = `<svg viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="xMidYMid slice">${dots}</svg>`;
  return wrap;
}

function cardFor(a, featured = false) {
  const n = a.source_count || 0;
  const mins = a.reading_minutes;
  return el("li", { class: "card" + (featured ? " featured" : "") },
    cover(a.slug, featured),
    el("div", { class: "card-body" },
      el("div", { class: "card-meta" },
        featured ? el("span", { class: "badge latest", text: "Latest" }) : null,
        el("time", { datetime: a.published_at || "", text: fmtDate(a.published_at) }),
        mins ? el("span", { text: `${mins} min read` }) : null),
      el("h2", {}, el("a", { href: `#/article/${encodeURIComponent(a.slug)}`, text: a.title })),
      a.summary ? el("p", { text: a.summary }) : null,
      el("div", { class: "card-foot" },
        n ? el("span", { class: "badge", text: plural(n, "source") }) : el("span"),
        el("span", { class: "read", "aria-hidden": "true", text: "Read guide" }))));
}

/* One pointer listener on the grid, not one per card */
function spotlight(grid) {
  grid.addEventListener("pointermove", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", `${e.clientX - r.left}px`);
    card.style.setProperty("--my", `${e.clientY - r.top}px`);
  });
}

/* ---------- home ---------- */
async function renderHome() {
  document.title = SITE_NAME;
  progress.hidden = true;
  tools.replaceChildren();
  showState("Loading guides", "");
  try {
    const { articles } = await api();
    if (!articles.length) {
      return showState("No guides published yet", "New guides appear here once they're published.");
    }
    const intro = el("section", { class: "intro reveal" },
      el("h1", { text: "The Philippine property market, explained with sources" }), el("div", { class: "rule", "aria-hidden": "true" }),
      el("p", { text: "Plain-language guides for buyers, investors and brokers: how each part of the market works, what the numbers say, and what can go wrong. Every fact links to the page it came from." }));
    const grid = el("ul", { class: "grid reveal" });
    articles.forEach((a, i) => grid.append(cardFor(a, i === 0)));
    spotlight(grid);
    const none = el("p", { class: "no-match", text: "No guides match that search." });
    none.hidden = true;

    if (articles.length >= 4) {
      const input = el("input", { type: "search", placeholder: "Search guides", "aria-label": "Search guides" });
      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        let shown = 0;
        [...grid.children].forEach((li, i) => {
          const a = articles[i];
          const hit = !q || `${a.title} ${a.summary || ""}`.toLowerCase().includes(q);
          li.hidden = !hit;
          li.classList.toggle("featured", i === 0 && !q);
          if (hit) shown++;
        });
        none.hidden = shown > 0;
      });
      tools.replaceChildren(el("div", { class: "search" }, input));
    } else {
      tools.replaceChildren(el("span", { class: "count", text: plural(articles.length, "guide") }));
    }
    app.replaceChildren(intro, grid, none);
  } catch (err) {
    showState("Guides couldn't load", err.message);
  }
}

/* ---------- article ---------- */
function splitDisclaimer(md, disclaimer) {
  const i = md.lastIndexOf("\n---");
  if (i !== -1 && md.length - i < 1200) return [md.slice(0, i), disclaimer || md.slice(i + 4).replace(/[*_]/g, "").trim()];
  return [md, disclaimer];
}

function linkSources(md, claims) {
  const sourceOfClaim = new Map(claims.map(c => [String(c.claim_id), c]));
  const order = [], numberOf = new Map();
  const out = md.replace(/(?:[ \t]*\[c(\d+)\])+/g, (run) => {
    const nums = [];
    for (const m of run.matchAll(/\[c(\d+)\]/g)) {
      const c = sourceOfClaim.get(m[1]);
      if (!c) continue;
      if (!numberOf.has(c.source_id)) { numberOf.set(c.source_id, order.length + 1); order.push(c); }
      const n = numberOf.get(c.source_id);
      if (!nums.includes(n)) nums.push(n);
    }
    if (!nums.length) return "";
    return `<span class="cite">${nums.map(n =>
      `<button type="button" data-src="${n}" aria-expanded="false" aria-label="Source ${n}">${n}</button>`).join("")}</span>`;
  });
  return { md: out, sources: order };
}

function sourceList(sources, idPrefix) {
  const list = el("ol", { class: "src-list" });
  sources.forEach((s, i) => list.append(el("li", { id: `${idPrefix}-${i + 1}` },
    el("span", { class: "n", text: String(i + 1) }),
    el("span", {}, el("a", { href: s.url, target: "_blank", rel: "noopener", text: s.title || s.url }),
      s.publisher ? el("span", { class: "pub", text: s.publisher }) : null))));
  return list;
}

function jumpToSource(n) {
  const wide = window.matchMedia("(min-width: 1180px)").matches;
  const item = document.getElementById(`${wide ? "rail" : "end"}-src-${n}`);
  if (!item) return;
  item.scrollIntoView({ behavior: "smooth", block: "center" });
  item.classList.add("flash");
  setTimeout(() => item.classList.remove("flash"), 1600);
}

let popover = null;
function closePopover() {
  if (!popover) return;
  popover.owner.setAttribute("aria-expanded", "false");
  popover.node.remove();
  popover = null;
}
function openPopover(btn, src, n) {
  const wasOpen = popover && popover.owner === btn;
  closePopover();
  if (wasOpen || !src) return;
  let host = src.publisher;
  if (!host) { try { host = new URL(src.url).hostname; } catch { host = ""; } }
  const jump = el("button", { type: "button", class: "jump", text: "Show in source list" });
  jump.addEventListener("click", () => { closePopover(); jumpToSource(n); });
  const node = el("div", { class: "popover", role: "dialog", "aria-label": `Source ${n}` },
    el("div", { class: "pub", text: host }),
    el("a", { href: src.url, target: "_blank", rel: "noopener", text: src.title || src.url }),
    el("div", {}, jump));
  document.body.append(node);
  const r = btn.getBoundingClientRect();
  const maxLeft = window.scrollX + document.documentElement.clientWidth - node.offsetWidth - 16;
  node.style.left = Math.min(Math.max(16, r.left + window.scrollX - 20), maxLeft) + "px";
  node.style.top = (r.bottom + window.scrollY + 8) + "px";
  btn.setAttribute("aria-expanded", "true");
  popover = { node, owner: btn };
}

/* ---------- PDF download (library and fonts load only when clicked) ---------- */
const PDF_LIB = "https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js";
const FONT_BASE = "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/";
const BRAND = { nile: "#1C335E", muesli: "#BE8562", midnight: "#0E192F", iron: "#D2D2D2", muted: "#5A6275", cream: "#F7F2EB" };
let pdfLib = null;
function loadPdfLib() {
  if (pdfLib) return pdfLib;
  pdfLib = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PDF_LIB; s.async = true;
    s.onload = () => {
      const f = (p) => FONT_BASE + p;
      window.pdfMake.fonts = {
        Poppins: { normal: f("poppins/Poppins-Regular.ttf"), bold: f("poppins/Poppins-SemiBold.ttf"), italics: f("poppins/Poppins-Italic.ttf"), bolditalics: f("poppins/Poppins-Italic.ttf") },
        Cantata: { normal: f("cantataone/CantataOne-Regular.ttf"), bold: f("cantataone/CantataOne-Regular.ttf"), italics: f("cantataone/CantataOne-Regular.ttf"), bolditalics: f("cantataone/CantataOne-Regular.ttf") },
        Judson: { normal: f("judson/Judson-Regular.ttf"), bold: f("judson/Judson-Bold.ttf"), italics: f("judson/Judson-Italic.ttf"), bolditalics: f("judson/Judson-Italic.ttf") },
      };
      resolve(window.pdfMake);
    };
    s.onerror = () => { pdfLib = null; reject(new Error("PDF library failed to load")); };
    document.head.append(s);
  });
  return pdfLib;
}
const decodeHtml = (str) => { const t = document.createElement("textarea"); t.innerHTML = str; return t.value; };

function pdfMarkers(md, sources, claims) {
  const numberOf = new Map(sources.map((s, i) => [s.source_id, i + 1]));
  const sourceOfClaim = new Map(claims.map((c) => [String(c.claim_id), c.source_id]));
  return md.replace(/(?:[ \t]*\[c(\d+)\])+/g, (run) => {
    const nums = [];
    for (const m of run.matchAll(/\[c(\d+)\]/g)) {
      const n = numberOf.get(sourceOfClaim.get(m[1]));
      if (n && !nums.includes(n)) nums.push(n);
    }
    return nums.length ? `⟦${nums.join(",")}⟧` : "";
  });
}
function pdfInline(tokens, base = {}) {
  const out = [];
  for (const t of tokens || []) {
    if (t.type === "strong") out.push(...pdfInline(t.tokens, { ...base, bold: true }));
    else if (t.type === "em") out.push(...pdfInline(t.tokens, { ...base, italics: true }));
    else if (t.type === "link") out.push(...pdfInline(t.tokens, { ...base, link: t.href, color: BRAND.nile, decoration: "underline" }));
    else if (t.type === "br") out.push({ text: "\n" });
    else if (t.type !== "text" && t.type !== "escape" && t.tokens) out.push(...pdfInline(t.tokens, base));
    else if (t.type === "text" && t.tokens) out.push(...pdfInline(t.tokens, base));
    else {
      decodeHtml(t.text ?? t.raw ?? "").split(/(⟦[\d,]+⟧)/).forEach((part) => {
        if (!part) return;
        const m = part.match(/^⟦([\d,]+)⟧$/);
        out.push(m ? { text: m[1], sup: true, fontSize: 7, bold: true, color: BRAND.muesli } : { text: part, ...base });
      });
    }
  }
  return out;
}
function pdfBlocks(tokens) {
  const out = [];
  for (const t of tokens) {
    if (t.type === "heading" && t.depth <= 2) {
      out.push({ stack: [
        { canvas: [{ type: "line", x1: 0, y1: 0, x2: 36, y2: 0, lineWidth: 1.6, lineColor: BRAND.muesli }], margin: [0, 14, 0, 7] },
        { text: pdfInline(t.tokens), style: "h2" }], headlineLevel: 1, unbreakable: true });
    } else if (t.type === "heading") out.push({ text: pdfInline(t.tokens), style: "h3" });
    else if (t.type === "paragraph") out.push({ text: pdfInline(t.tokens), style: "p" });
    else if (t.type === "list") {
      const items = t.items.map((it) => {
        const parts = pdfBlocks(it.tokens.map((x) => (x.type === "text" ? { type: "paragraph", tokens: x.tokens || [x] } : x)));
        parts.forEach((p) => { if (p.style === "p") p.style = "li"; });
        return parts.length === 1 ? parts[0] : { stack: parts };
      });
      out.push({ [t.ordered ? "ol" : "ul"]: items, markerColor: BRAND.muesli, margin: [6, 0, 0, 8] });
    } else if (t.type === "blockquote") {
      out.push({ table: { widths: [3, "*"], body: [[{ text: "", fillColor: BRAND.muesli }, { stack: pdfBlocks(t.tokens), margin: [8, 2, 0, 0] }]] },
        layout: "noBorders", margin: [0, 2, 0, 8] });
    } else if (t.type === "table") {
      const head = t.header.map((c) => ({ text: pdfInline(c.tokens), bold: true, color: "#FFFFFF", fillColor: BRAND.nile }));
      const rows = t.rows.map((r) => r.map((c) => ({ text: pdfInline(c.tokens) })));
      out.push({ table: { headerRows: 1, widths: head.map(() => "*"), body: [head, ...rows] }, layout: "lightHorizontalLines", fontSize: 8.5, margin: [0, 4, 0, 10] });
    } else if (t.type === "code") out.push({ text: t.text, style: "p" });
  }
  return out;
}
function buildPdfDoc({ article, bodyMd, sources, claims, disclaimer, mins }) {
  const url = `${location.origin}/#/article/${encodeURIComponent(article.slug)}`;
  const meta = [`Published ${fmtDate(article.published_at)}`, `${mins} min read`, sources.length ? `Built from ${plural(sources.length, "source")}` : ""].filter(Boolean).join("     ");
  return {
    pageSize: "A4",
    pageMargins: [56, 70, 56, 62],
    info: { title: article.title, author: "GRID Property Ventures", subject: article.summary || "", creator: SITE_NAME },
    defaultStyle: { font: "Poppins", fontSize: 10, lineHeight: 1.45, color: BRAND.midnight },
    background: (page, size) => ({ canvas: [
      { type: "rect", x: 0, y: 0, w: size.width, h: 7, color: BRAND.nile },
      { type: "rect", x: 0, y: 7, w: size.width, h: 2, color: BRAND.muesli }] }),
    header: (page) => ({ margin: [56, 26, 56, 0], columns: [
      { width: "auto", text: [{ text: "GRID", font: "Cantata", fontSize: 14, color: BRAND.nile, characterSpacing: 2 },
                              { text: "  Insights", font: "Judson", italics: true, fontSize: 12.5, color: BRAND.muesli }] },
      { width: "*", text: page === 1 ? "" : article.title, alignment: "right", fontSize: 7.5, color: BRAND.muted, margin: [16, 4, 0, 0] }] }),
    footer: (page, count) => ({ margin: [56, 22, 56, 0], columns: [
      { width: "*", text: "GRID Property Ventures. General information only, not legal, tax or investment advice.", fontSize: 7, color: BRAND.muted },
      { width: 70, text: `Page ${page} of ${count}`, alignment: "right", fontSize: 7, color: BRAND.muted }] }),
    content: [
      { text: article.title, style: "title" },
      article.summary ? { text: article.summary, style: "dek" } : null,
      { text: meta, style: "meta" },
      { canvas: [{ type: "line", x1: 0, y1: 0, x2: 483, y2: 0, lineWidth: 0.6, lineColor: BRAND.iron }], margin: [0, 2, 0, 4] },
      ...pdfBlocks(marked.lexer(pdfMarkers(bodyMd, sources, claims))),
      sources.length ? { stack: [
        { canvas: [{ type: "line", x1: 0, y1: 0, x2: 36, y2: 0, lineWidth: 1.6, lineColor: BRAND.muesli }], margin: [0, 16, 0, 7] },
        { text: "Sources", style: "h2" }], unbreakable: true } : null,
      sources.length ? { layout: "noBorders", table: { widths: [16, "*"], dontBreakRows: true, body: sources.map((s, i) => [
        { text: String(i + 1), bold: true, color: BRAND.muesli, fontSize: 9 },
        { margin: [0, 0, 0, 5], stack: [
          { text: s.title || s.url, link: s.url, bold: true, color: BRAND.nile, fontSize: 9 },
          s.publisher ? { text: s.publisher, fontSize: 8, color: BRAND.muted } : null,
          { text: s.url, link: s.url, fontSize: 7, color: BRAND.muted }].filter(Boolean) }]) } } : null,
      disclaimer ? { margin: [0, 14, 0, 0], table: { widths: ["*"], body: [[{ text: disclaimer, fontSize: 8.5, color: BRAND.muted, margin: [10, 8, 10, 8] }]] },
        layout: { hLineWidth: () => 0, vLineWidth: (i) => (i === 0 ? 3 : 0), vLineColor: () => BRAND.muesli, fillColor: () => BRAND.cream } } : null,
      { text: [{ text: "Read online with clickable sources: " }, { text: url, link: url, color: BRAND.nile }], fontSize: 8, color: BRAND.muted, margin: [0, 12, 0, 0] },
    ].filter(Boolean),
    styles: {
      title: { font: "Cantata", fontSize: 22, lineHeight: 1.18, color: BRAND.nile, margin: [0, 8, 0, 8] },
      dek: { font: "Judson", italics: true, fontSize: 13, lineHeight: 1.3, color: BRAND.muted, margin: [0, 0, 0, 8] },
      meta: { fontSize: 8.5, color: BRAND.muted, margin: [0, 0, 0, 4] },
      h2: { font: "Cantata", fontSize: 14.5, lineHeight: 1.25, color: BRAND.nile, margin: [0, 0, 0, 6] },
      h3: { bold: true, fontSize: 11, margin: [0, 8, 0, 4] },
      p: { margin: [0, 0, 0, 8] },
      li: { margin: [0, 0, 0, 4] },
    },
    pageBreakBefore: (node, followingOnPage) => node.headlineLevel === 1 && followingOnPage.length === 0,
  };
}
async function downloadPdf(btn, data) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Preparing PDF";
  try {
    const pdfMake = await loadPdfLib();
    const doc = buildPdfDoc(data);
    await Promise.race([
      new Promise((resolve, reject) => { try { pdfMake.createPdf(doc).download(`${data.article.slug}.pdf`, resolve); } catch (e) { reject(e); } }),
      new Promise((_, reject) => setTimeout(() => reject(new Error("PDF timed out")), 30000)),
    ]);
  } catch (err) {
    console.error(err);
    if (window.confirm("The PDF couldn't be created in this browser. Open the print dialog instead? Choose \"Save as PDF\" as the printer.")) window.print();
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

let cleanupArticle = () => {};
async function renderArticle(slug) {
  tools.replaceChildren(el("a", { class: "nav-link", href: "#/", text: "All guides" }));
  showState("Loading guide", "");
  try {
    const { article, claims } = await api("?slug=" + encodeURIComponent(slug));
    document.title = `${article.title} | ${SITE_NAME}`;
    const [bodyMd, disclaimer] = splitDisclaimer(article.body_md, article.disclaimer);
    const { md, sources } = linkSources(bodyMd, claims);
    const mins = article.reading_minutes || minutesFromText(bodyMd);

    const body = el("div", { class: "body" });
    body.innerHTML = marked.parse(md);
    body.querySelectorAll("h1").forEach(h => { const h2 = el("h2"); h2.innerHTML = h.innerHTML; h.replaceWith(h2); });
    body.querySelectorAll("table").forEach(t => { const w = el("div", { class: "table-scroll" }); t.replaceWith(w); w.append(t); });
    const headings = [...body.querySelectorAll("h2")];
    headings.forEach((h, i) => { h.id = `section-${i + 1}`; });
    body.addEventListener("click", (e) => {
      const btn = e.target.closest(".cite button");
      if (!btn) return;
      e.stopPropagation();
      const n = Number(btn.dataset.src);
      openPopover(btn, sources[n - 1], n);
    });

    const tocList = el("ol");
    headings.forEach(h => {
      const a = el("a", { href: `#${h.id}`, text: h.textContent });
      a.addEventListener("click", (e) => { e.preventDefault(); h.scrollIntoView({ behavior: "smooth", block: "start" }); });
      tocList.append(el("li", {}, a));
    });

    const updated = article.updated_at && article.published_at &&
      (new Date(article.updated_at) - new Date(article.published_at)) > 86400000 ? article.updated_at : null;
    const sourcesChip = el("a", { class: "chip accent", href: "#sources-end", text: `Built from ${plural(sources.length, "source")}` });
    sourcesChip.addEventListener("click", (e) => {
      e.preventDefault();
      const wide = window.matchMedia("(min-width: 1180px)").matches;
      document.getElementById(wide ? "rail" : "sources-end").scrollIntoView({ behavior: "smooth", block: wide ? "center" : "start" });
    });

    const pdfButton = el("button", { class: "chip dl", type: "button", "aria-label": "Download this article as a PDF", text: "Download PDF" });
    pdfButton.addEventListener("click", () => downloadPdf(pdfButton, { article, bodyMd, sources, claims, disclaimer, mins }));

    const art = el("article", {},
      el("a", { class: "back", href: "#/", text: "All guides" }),
      el("h1", { text: article.title }),
      article.summary ? el("p", { class: "dek", text: article.summary }) : null,
      el("div", { class: "byline" },
        el("time", { class: "chip", datetime: article.published_at || "", text: `Published ${fmtDate(article.published_at)}` }),
        updated ? el("time", { class: "chip", datetime: updated, text: `Updated ${fmtDate(updated)}` }) : null,
        el("span", { class: "chip", text: `${mins} min read` }),
        sources.length ? sourcesChip : null,
        pdfButton),
      body,
      sources.length ? el("section", { class: "sources-end", id: "sources-end" },
        el("p", { class: "side-title", text: "Sources" }), sourceList(sources, "end-src")) : null,
      disclaimer ? el("p", { class: "disclaimer", text: disclaimer }) : null);

    const toc = el("aside", { class: "toc", "aria-label": "On this page" },
      el("div", {}, el("p", { class: "side-title", text: "On this page" }), tocList));
    const rail = el("aside", { class: "rail", id: "rail", "aria-label": "Sources" },
      el("div", {}, sources.length ? el("div", { class: "rail-card" },
        el("p", { class: "side-title", text: `Sources (${sources.length})` }), sourceList(sources, "rail-src")) : null));

    const more = el("section", { class: "more" });
    more.hidden = true;
    app.replaceChildren(el("div", { class: "layout reveal" }, toc, art, rail), more);
    window.scrollTo(0, 0);

    /* Active section in the table of contents */
    const links = [...tocList.querySelectorAll("a")];
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        links.forEach(l => l.classList.toggle("active", l.getAttribute("href") === `#${en.target.id}`));
      });
    }, { rootMargin: "-15% 0px -70% 0px" });
    headings.forEach(h => observer.observe(h));

    /* Reading progress */
    progress.hidden = false;
    const onScroll = () => {
      const r = art.getBoundingClientRect();
      const total = r.height - window.innerHeight;
      const done = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : 1;
      progress.style.width = `${done * 100}%`;
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    cleanupArticle = () => { observer.disconnect(); window.removeEventListener("scroll", onScroll); progress.hidden = true; };

    renderMore(slug, more);
  } catch (err) {
    if (err.status === 404) showState("Guide not found", "It may have been unpublished or renamed.", true);
    else showState("This guide couldn't load", err.message, true);
  }
}

async function renderMore(currentSlug, container) {
  try {
    const { articles } = await api();
    const others = articles.filter(a => a.slug !== currentSlug).slice(0, 4);
    if (!others.length) return;
    const grid = el("ul", { class: "grid" });
    others.forEach(a => grid.append(cardFor(a)));
    spotlight(grid);
    container.replaceChildren(el("h2", { text: "More guides" }), grid);
    container.hidden = false;
  } catch { /* suggestions are optional */ }
}

/* ---------- router ---------- */
function route() {
  const h = location.hash || "#/";
  if (!h.startsWith("#/") && app.querySelector("article")) return; // in-page jump, not a page change
  closePopover();
  cleanupArticle();
  cleanupArticle = () => {};
  const m = h.match(/^#\/article\/(.+)$/);
  if (m) renderArticle(decodeURIComponent(m[1])); else renderHome();
}
document.addEventListener("click", (e) => { if (popover && !popover.node.contains(e.target)) closePopover(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && popover) { const o = popover.owner; closePopover(); o.focus(); } });
window.addEventListener("hashchange", route);
route();
</script>
